<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Sandbox Console</title>
    <!-- Compiled Tailwind CSS via PostCSS -->
    <link rel="stylesheet" href="/static/style.css">
    <!-- Highlight.js for JSON/Code formatting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-screen flex flex-col overflow-hidden">
    <!-- Top Navigation Bar -->
    <header class="h-14 border-b border-border bg-panel flex items-center justify-between px-6 shrink-0 z-20">
        <div class="flex items-center gap-3">
            <div class="p-1.5 bg-zinc-800 text-zinc-300 rounded border border-zinc-700 shadow-sm">
                <i data-lucide="cpu" class="w-5 h-5"></i>
            </div>
            <h1 class="font-semibold tracking-tight text-sm uppercase text-zinc-200">Local Multi-Agent Sandbox</h1>
        </div>
        <div class="flex items-center gap-3 text-sm">
            <div id="ws-badge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-red-500/10 text-red-400 border border-red-500/20 transition-colors">
                <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse" id="ws-indicator"></div>
                <span id="ws-text" class="font-medium text-xs tracking-wide">Connecting...</span>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Control Sidebar -->
        <aside class="w-[340px] border-r border-border bg-panel/50 p-5 flex flex-col gap-8 shrink-0 overflow-y-auto z-10 shadow-xl">
            
            <!-- Dispatch Task Section -->
            <div class="flex flex-col gap-3">
                <div class="flex items-center gap-2 text-zinc-400 pb-2 border-b border-border">
                    <i data-lucide="zap" class="w-4 h-4"></i>
                    <h2 class="text-xs font-semibold uppercase tracking-wider">Dispatch Task</h2>
                </div>
                <textarea id="task-input" rows="4" class="w-full bg-dark border border-border rounded-lg p-3 text-sm text-zinc-200 placeholder:text-zinc-600 focus:outline-none focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/50 transition-all resize-none shadow-inner" placeholder="e.g. Build an asynchronous memory cache..."></textarea>
                <button id="dispatch-btn" class="w-full bg-zinc-100 hover:bg-white text-zinc-900 font-medium py-2 px-4 rounded-lg flex items-center justify-center gap-2 transition-colors active:scale-[0.98] shadow-sm cursor-pointer">
                    <i data-lucide="play" class="w-4 h-4"></i>
                    Enqueue Task
                </button>
            </div>

            <!-- FTS5 Timeline Search -->
            <div class="flex flex-col gap-3">
                <div class="flex items-center gap-2 text-zinc-400 pb-2 border-b border-border">
                    <i data-lucide="search" class="w-4 h-4"></i>
                    <h2 class="text-xs font-semibold uppercase tracking-wider">Timeline Search</h2>
                </div>
                <div class="relative group">
                    <i data-lucide="hash" class="w-4 h-4 absolute left-3 top-3 text-zinc-500 group-focus-within:text-purple-400 transition-colors"></i>
                    <input type="text" id="search-input" class="w-full bg-dark border border-border rounded-lg py-2.5 pl-9 pr-3 text-sm text-zinc-200 placeholder:text-zinc-600 focus:outline-none focus:border-purple-500/50 focus:ring-1 focus:ring-purple-500/50 transition-all shadow-inner" placeholder="Query SQLite FTS5...">
                </div>
                <div class="flex gap-2 text-sm mt-1">
                    <button id="search-btn" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 py-2 rounded-lg transition-colors border border-zinc-700 shadow-sm cursor-pointer">Search</button>
                    <button id="reset-btn" class="flex-1 bg-transparent hover:bg-zinc-800/50 text-zinc-400 py-2 rounded-lg transition-colors border border-transparent hover:border-zinc-700 cursor-pointer">Reset</button>
                </div>
            </div>
        </aside>

        <!-- Blackboard Stream (Main Feed) -->
        <main class="flex-1 flex flex-col bg-dark overflow-hidden relative">
            <!-- Subtle Dot Matrix Background -->
            <div class="absolute inset-0 pointer-events-none bg-[radial-gradient(#27272a_1px,transparent_1px)] [background-size:16px_16px] opacity-20"></div>
            
            <div class="flex items-center justify-between px-6 py-4 border-b border-border/50 bg-dark/90 backdrop-blur z-10 sticky top-0">
                <h2 class="text-sm font-medium flex items-center gap-2 text-zinc-300">
                    <i data-lucide="activity" class="w-4 h-4 text-emerald-500"></i>
                    Live Event Stream
                </h2>
                <span class="text-[11px] font-mono text-zinc-500 px-2 py-1 rounded-md bg-zinc-900 border border-zinc-800 tracking-wider">
                    <span id="event-count">0</span> EVENTS
                </span>
            </div>

            <div id="timeline" class="flex-1 overflow-y-auto p-6 flex flex-col-reverse gap-6 z-10 scroll-smooth pb-20">
                <!-- Empty State -->
                <div id="empty-state" class="h-full flex flex-col items-center justify-center text-zinc-600 gap-4 mb-20">
                    <i data-lucide="box" class="w-12 h-12 stroke-1"></i>
                    <p class="text-sm">Awaiting blackboard events...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();
        
        const timeline = document.getElementById('timeline');
        const emptyState = document.getElementById('empty-state');
        const eventCountEl = document.getElementById('event-count');
        let eventCounter = 0;
        const renderedEventIds = new Set();

        // Color coding dynamically based on Agent Role
        const getRoleStyles = (role) => {
            const roleMap = {
                'USER': 'bg-zinc-800 text-zinc-300 border-zinc-600',
                'CODER': 'bg-blue-500/10 text-blue-400 border-blue-500/30',
                'SUPERVISOR': 'bg-purple-500/10 text-purple-400 border-purple-500/30',
                'DESIGNER': 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30',
                'REVIEWER': 'bg-amber-500/10 text-amber-400 border-amber-500/30'
            };
            return roleMap[(role || '').toUpperCase()] || 'bg-zinc-800 text-zinc-400 border-zinc-700';
        };

        // UI function to inject new WebSocket / REST data
        function createEventCard(event) {
            if (event.id && renderedEventIds.has(event.id)) {
                return; // prevent duplicate renders
            }
            if (event.id) renderedEventIds.add(event.id);

            if (emptyState) emptyState.style.display = 'none';
            
            // Prettify raw JSON to make it highly readable
            let formattedData = event.data;
            try {
                if (typeof event.data === 'string') {
                    formattedData = JSON.stringify(JSON.parse(event.data), null, 2);
                } else if (typeof event.data === 'object') {
                    formattedData = JSON.stringify(event.data, null, 2);
                }
            } catch(e) {}

            const role = event.role || event.agent_role || 'SYSTEM';
            const roleStyle = getRoleStyles(role);
            const card = document.createElement('div');
            
            card.className = 'bg-panel border border-border rounded-lg overflow-hidden shadow-sm transition-all hover:border-zinc-700 group';
            card.innerHTML = `
                <div class="px-4 py-2 border-b border-border/50 bg-panel flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-widest border ${roleStyle}">
                            #${event.id || ++eventCounter} • ${role}
                        </span>
                        <span class="text-xs text-zinc-500 font-mono">
                            Action: <span class="text-zinc-300 font-medium">${event.status || 'unknown'}</span>
                        </span>
                    </div>
                    <span class="text-[10px] text-zinc-600 font-mono opacity-0 group-hover:opacity-100 transition-opacity">
                        ${event.timestamp || new Date().toLocaleTimeString()}
                    </span>
                </div>
                <div class="p-4 overflow-x-auto bg-[#0d0d0f] border-t border-black/50">
                    <pre><code class="language-json text-xs mono leading-relaxed">${escapeHtml(formattedData)}</code></pre>
                </div>
            `;
            
            // Append to top of the reversed flex column
            timeline.prepend(card);
            
            // Apply Highlight.js to the new card
            card.querySelectorAll('pre code').forEach((el) => {
                hljs.highlightElement(el);
            });
            
            eventCountEl.innerText = document.querySelectorAll('#timeline > div.bg-panel').length;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        /* -------------------------------------------------------------
           REAL WEBSOCKET CONNECTION
        --------------------------------------------------------------*/
        const wsBadge = document.getElementById('ws-badge');
        const wsText = document.getElementById('ws-text');
        const wsIndicator = document.getElementById('ws-indicator');

        function connectWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/events`;
            const ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                wsBadge.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 transition-colors shadow-sm';
                wsIndicator.className = 'w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)] animate-pulse';
                wsText.innerText = 'WS Connected';
            };

            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    createEventCard(data);
                } catch (err) {
                    console.error('WS message error:', err);
                }
            };

            ws.onclose = () => {
                wsBadge.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full bg-red-500/10 text-red-400 border border-red-500/20 transition-colors';
                wsIndicator.className = 'w-2 h-2 rounded-full bg-red-500 animate-pulse';
                wsText.innerText = 'Disconnected (reconnecting...)';
                setTimeout(connectWS, 2000);
            };

            ws.onerror = () => {
                ws.close();
            };
        }

        // Connect immediately
        connectWS();
        
        // Hook up the Dispatch Button to FastAPI POST /task endpoint
        async function dispatchTask() {
            const input = document.getElementById('task-input');
            const val = input.value.trim();
            if(!val) return;
            
            input.value = '';
            
            try {
                const res = await fetch('/task', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: val })
                });
                if (!res.ok) {
                    const err = await res.json();
                    alert('Error: ' + (err.detail || 'Failed to dispatch task'));
                }
            } catch (err) {
                console.error('Task dispatch error:', err);
                alert('Network error submitting task: ' + err.message);
            }
        }

        document.getElementById('dispatch-btn').addEventListener('click', dispatchTask);
        document.getElementById('task-input').addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                dispatchTask();
            }
        });

        // FTS5 Search and Reset
        async function searchTimeline() {
            const q = document.getElementById('search-input').value.trim();
            if (!q) return;

            try {
                const res = await fetch(`/search?q=${encodeURIComponent(q)}`);
                if (res.ok) {
                    const data = await res.json();
                    timeline.innerHTML = '';
                    renderedEventIds.clear();

                    if (data.results && data.results.length > 0) {
                        data.results.forEach(evt => createEventCard(evt));
                    } else {
                        timeline.innerHTML = `
                            <div class="h-full flex flex-col items-center justify-center text-zinc-600 gap-2 mb-20">
                                <p class="text-sm">No events found matching "${escapeHtml(q)}"</p>
                            </div>`;
                    }
                    eventCountEl.innerText = data.count || 0;
                }
            } catch (err) {
                console.error('Search error:', err);
            }
        }

        document.getElementById('search-btn').addEventListener('click', searchTimeline);
        document.getElementById('search-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') searchTimeline();
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            document.getElementById('search-input').value = '';
            timeline.innerHTML = '';
            renderedEventIds.clear();
            loadRecentEvents();
        });

        // Load existing events on startup
        async function loadRecentEvents() {
            try {
                const res = await fetch('/events?limit=50');
                if (res.ok) {
                    const events = await res.json();
                    if (events && events.length > 0) {
                        // Reverse so prepend puts newest at the top
                        events.reverse().forEach(evt => createEventCard(evt));
                    }
                }
            } catch (e) {
                console.warn('Could not fetch initial events:', e);
            }
        }

        loadRecentEvents();
    </script>
</body>
</html>
