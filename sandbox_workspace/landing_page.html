<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-commerce Food App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#menu">Menu</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section id="home">
      <h1>Welcome to our E-commerce Food App</h1>
      <p>Explore our wide selection of delicious food items.</p>
      <a href="#menu" class="btn">View Menu</a>
    </section>
    <section id="menu">
      <h2>Our Menu</h2>
      <div class="menu-items">
        <div class="menu-item">
          <img src="menu-item1.jpg" alt="Menu Item 1">
          <h3>Item 1</h3>
          <p>$9.99</p>
          <a href="#menu-item1" class="btn">Add to Cart</a>
        </div>
        <div class="menu-item">
          <img src="menu-item2.jpg" alt="Menu Item 2">
          <h3>Item 2</h3>
          <p>$14.99</p>
          <a href="#menu-item2" class="btn">Add to Cart</a>
        </div>
        <!-- Add more menu items as needed -->
      </div>
    </section>
    <section id="contact">
      <h2>Contact Us</h2>
      <p>Get in touch with us for any questions or concerns.</p>
      <a href="#contact" class="btn">Contact Us</a>
    </section>
  </main>
  <footer>
    <p>&copy; 2023 E-commerce Food App</p>
  </footer>
</body>
</html>
